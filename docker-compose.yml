name: coachia

services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - DB_PATH=/app/data/coachia.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      - BACKEND_ORIGIN=${BACKEND_ORIGIN:-backend:3000}
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
